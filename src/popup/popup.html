<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>md-browser</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="popup-header">
      <h1>Markdown Browser</h1>
      <p class="popup-subtitle">Markdown reader controls for the current tab.</p>
    </header>

    <div class="popup-body">
      <div class="status-row">
        <span class="status-label">Page source</span>
        <span class="status-value" id="source-type">Checking…</span>
      </div>
      <div class="status-row" id="tokens-row" hidden>
        <span class="status-label">Tokens</span>
        <span class="status-value" id="tokens-value">—</span>
      </div>
      <div class="status-row" id="url-row" hidden>
        <span class="status-label">URL</span>
        <span class="status-value status-url" id="page-url">—</span>
      </div>
      <section class="setting-block" aria-label="Link checks setting">
        <label class="status-row status-toggle" for="link-checks-toggle">
          <span class="status-label">Link checks</span>
          <input type="checkbox" id="link-checks-toggle" />
        </label>
        <p class="setting-help" id="link-checks-help">
          Marks links in reader mode as likely markdown or non-markdown by sending lightweight background checks.
        </p>
      </section>
    </div>

    <div class="popup-actions">
      <button id="btn-toggle" class="btn" hidden>View original</button>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
